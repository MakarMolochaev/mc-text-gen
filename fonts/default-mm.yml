    sizeX: 3
    sizeY: 5
    scheme: "000000000000000"
  - symbol: "."
    sizeX: 3
    sizeY: 5
    scheme: "000000000000010"
  - symbol: ","
    sizeX: 3
    sizeY: 5
    bias: 1
    scheme: "000000000010110"
  - symbol: "!"
    sizeX: 2
    sizeY: 5
    scheme: "0101010001"
  - symbol: "?"
    sizeX: 3
    sizeY: 5
    scheme: "111001010000010"
  - symbol: ":"
    sizeX: 3
    sizeY: 5
    scheme: "000010000000010"
  - symbol: ";"
    sizeX: 3
    sizeY: 5
    scheme: "000010000010110"